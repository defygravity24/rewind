<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewind">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Rewind</title>
<style>
:root {
  --bg: #0e1117;
  --surface: #161b22;
  --surface-2: #1c232e;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.13);
  --text: #e9eef5;
  --muted: #8b97a7;
  --faint: #5c6674;
  --accent: #4fd6a5;
  --accent-soft: rgba(79, 214, 165, .14);
  --accent-ink: #04231a;
  --gold: #f5b942;
  --danger: #ff5a5f;
  --r: 14px;
  --r-lg: 18px;
  --tabbar: 58px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, textarea { font-family: inherit; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-star { width: 27px; height: 27px; fill: currentColor; }
.app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px;
  background: rgba(14, 17, 23, 0.82);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 9px; cursor: pointer;
  background: none; border: 0; padding: 0; color: inherit;
  font-size: 17px; font-weight: 700; letter-spacing: -.2px;
}
.brand-mark { width: 26px; height: 26px; }
.saved-flag { color: var(--accent); font-size: 12.5px; font-weight: 600; opacity: 0; transition: opacity .3s ease; }
.saved-flag.on { opacity: 1; }

.view { padding: 20px 20px calc(30px + var(--tabbar) + env(safe-area-inset-bottom, 0px)); flex: 1; display: flex; flex-direction: column; }

/* ---- bottom tab bar ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  background: rgba(14, 17, 23, 0.9);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { display: flex; width: 100%; max-width: 640px; }
.tabbar button {
  flex: 1; background: none; border: 0; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 0 8px; font-size: 10.5px; font-weight: 600;
}
.tabbar button .ic { width: 22px; height: 22px; }
.tabbar button.nav-on { color: var(--accent); }
.tabbar button:active { opacity: .55; }

/* ---- flow header ---- */
.flow-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flow-kicker { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.flow-title { font-size: 27px; font-weight: 700; letter-spacing: -.6px; line-height: 1.12; margin: 9px 0 0; }
.day-nav { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.day-btn {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; border-radius: 11px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.day-btn:active { background: var(--surface-2); }
.day-btn:disabled { opacity: .32; cursor: default; }
.day-btn .ic { width: 17px; height: 17px; }
.day-btn input[type="date"] {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; color-scheme: dark;
}

/* ---- progress ---- */
.progress { display: flex; align-items: center; gap: 12px; margin: 18px 0 24px; }
.segs { display: flex; gap: 5px; flex: 1; }
.seg { flex: 1; background: none; border: 0; padding: 7px 0; cursor: pointer; }
.seg i { display: block; height: 3px; border-radius: 3px; background: var(--line-2); transition: background .25s ease; }
.seg.done i { background: rgba(79, 214, 165, .4); }
.seg.now i { background: var(--accent); }
.step-lbl { color: var(--muted); font-size: 12px; font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ---- page ---- */
.page { flex: 1; animation: pagein .24s cubic-bezier(.2, .7, .3, 1); }
@keyframes pagein { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.page-title { font-size: 19px; font-weight: 700; letter-spacing: -.3px; margin: 0 0 3px; }
.page-sub { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 0 18px; }

/* ---- prompt rows (no boxes) ---- */
.q { padding: 18px 0; border-bottom: 1px solid var(--line); }
.q:first-of-type { border-top: 1px solid var(--line); }
.q-label { font-weight: 600; font-size: 15px; letter-spacing: -.1px; margin-bottom: 9px; transition: color .2s ease; }
.q:focus-within .q-label { color: var(--tc, var(--accent)); }
.q textarea {
  width: 100%; background: transparent; border: 0; color: var(--text); resize: none;
  font-size: 16.5px; line-height: 1.55; min-height: 26px; padding: 0; display: block;
}
.q textarea:focus { outline: none; }
.q textarea::placeholder { color: var(--faint); }

/* ---- stars ---- */
.stars { display: flex; gap: 4px; margin-left: -4px; }
.stars button {
  background: none; border: 0; padding: 4px; cursor: pointer; line-height: 0;
  color: rgba(255, 255, 255, .14); transition: color .15s ease, transform .12s ease;
}
.stars button.lit { color: var(--gold); }
.stars button:active { transform: scale(.88); }
.stars-hint { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 7px; min-height: 16px; }

/* ---- tags ---- */
.cdot { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--tc, var(--muted)); flex-shrink: 0; }
.tag-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 6px 10px 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
}
.tag button { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 12px; padding: 0; line-height: 1; font-weight: 700; }
.tag button:active { color: var(--danger); }
.tag-row input { flex: 1; min-width: 150px; background: transparent; border: 0; color: var(--text); font-size: 16.5px; padding: 7px 0; }
.tag-row input:focus { outline: none; }
.tag-row input::placeholder { color: var(--faint); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.suggest button {
  background: transparent; border: 1px solid var(--line-2); color: var(--muted);
  padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.suggest button:active { color: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); }

/* ---- media ---- */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.media-tile { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.media-tile img, .media-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.media-tile .vid-badge { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.media-tile .del { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; line-height: 22px; padding: 0; }
.media-add {
  aspect-ratio: 1; border-radius: 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-weight: 600; font-size: 12.5px;
}
.media-add:active { color: var(--accent); border-color: var(--accent); }
.media-add .plus { font-size: 22px; line-height: 1; font-weight: 400; }
.media-note { color: var(--muted); font-size: 12.5px; margin-top: 11px; line-height: 1.5; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.93); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox img, .lightbox video { max-width: 100%; max-height: 100%; border-radius: 10px; }
.lightbox .close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; background: rgba(255,255,255,.14); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; }

/* ---- recap (last page) ---- */
.recap { border-top: 1px solid var(--line); margin-top: 6px; }
.recap-row { display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.5; }
.recap-row .rk { color: var(--muted); font-weight: 600; font-size: 13px; width: 104px; flex-shrink: 0; }
.recap-row .rv { flex: 1; white-space: pre-wrap; word-break: break-word; }
.recap-stars { display: inline-flex; gap: 2px; color: var(--gold); vertical-align: -2px; }
.recap-stars .ic-star { width: 14px; height: 14px; }
.recap-hint { margin-left: 9px; color: var(--muted); font-weight: 500; }
.recap-empty { color: var(--muted); font-size: 14px; padding: 18px 0; }

/* ---- flow footer ---- */
.flow-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 26px; padding-top: 18px; }
.btn-accent {
  background: var(--accent); color: var(--accent-ink); border: 0;
  font-weight: 700; font-size: 15px; letter-spacing: -.1px; padding: 13px 24px; border-radius: 13px; cursor: pointer;
}
.btn-accent:active { background: #43c294; transform: translateY(1px); }
.btn-ghost {
  background: transparent; color: var(--text); border: 1px solid var(--line-2);
  font-weight: 600; font-size: 15px; padding: 12px 18px; border-radius: 13px; cursor: pointer;
}
.btn-ghost:active { background: var(--surface); }
.btn-ghost:disabled { opacity: .3; cursor: default; }
.btn-danger-ghost { color: var(--danger); border-color: rgba(255, 90, 95, .28); }
.btn-text { background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 14px; padding: 8px 4px; }

/* ---- journal ---- */
.search-wrap { position: relative; margin-bottom: 4px; }
.search-wrap .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); }
.search-wrap input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text);
  padding: 12px 14px 12px 38px; border-radius: 13px; font-size: 15.5px;
}
.search-wrap input:focus { outline: none; border-color: rgba(79, 214, 165, .5); }
.search-wrap input::placeholder { color: var(--faint); }
.month-h { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; padding: 24px 0 4px; }
.jlist { display: flex; flex-direction: column; }
.jrow { display: flex; gap: 14px; align-items: flex-start; padding: 15px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.jrow:active { opacity: .6; }
.jrow-cal { width: 40px; flex-shrink: 0; text-align: center; padding-top: 1px; }
.jrow-cal .d { font-size: 21px; font-weight: 700; line-height: 1.05; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.jrow-cal .w { color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 2px; }
.jrow-main { flex: 1; min-width: 0; }
.jrow-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.jrow-body { color: var(--text); font-size: 15px; font-weight: 500; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex: 1; }
.jrow-stars { display: flex; gap: 1.5px; color: var(--gold); flex-shrink: 0; padding-top: 3px; }
.jrow-stars .ic-star { width: 11px; height: 11px; }
.jrow-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.mini-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 3.5px 10px 3.5px 8px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini-chip.more { background: transparent; border-color: transparent; color: var(--faint); padding-left: 2px; }
.jrow-thumb { width: 52px; height: 52px; border-radius: 11px; object-fit: cover; flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); }
.empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: 15px; line-height: 1.7; }

/* ---- stats ---- */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; margin-bottom: 10px; }
.hero-top { display: flex; align-items: baseline; gap: 9px; }
.hero-num { color: var(--accent); font-size: 40px; font-weight: 700; letter-spacing: -1.6px; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-lbl { color: var(--muted); font-size: 14px; font-weight: 600; }
.strip { display: flex; gap: 4px; margin-top: 16px; }
.strip i { flex: 1; height: 22px; border-radius: 5px; background: var(--line); }
.strip i.on { background: var(--accent); opacity: .85; }
.strip-lbl { color: var(--faint); font-size: 11.5px; font-weight: 600; margin-top: 9px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; }
.stat-num { font-size: 26px; font-weight: 700; letter-spacing: -.7px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-lbl { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 3px; }
.stat-section { margin-bottom: 28px; }
.stat-h { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
.stat-h .cdot { width: 8px; height: 8px; }
.rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.rank-row:last-child { border-bottom: 0; }
.rank-n { color: var(--faint); font-weight: 600; font-size: 12px; width: 16px; font-variant-numeric: tabular-nums; }
.rank-name { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-bar { position: relative; height: 4px; width: 72px; flex-shrink: 0; border-radius: 4px; background: var(--line); }
.rank-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--tc, var(--accent)); opacity: .85; }
.rank-count { color: var(--tc, var(--muted)); font-weight: 600; font-size: 13px; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.sync-line { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin-bottom: 12px; }
.sync-line b { color: var(--text); }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--muted); vertical-align: 1px; }
.sync-dot.ok { background: var(--accent); }
.sync-dot.err { background: var(--danger); }
.sync-dot.busy { background: var(--vivid); }
.sync-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; letter-spacing: .5px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px;
  padding: 13px 14px; margin-bottom: 12px; word-break: break-all; line-height: 1.5;
}
.sync-input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text);
  padding: 12px 14px; border-radius: 13px; margin-bottom: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; letter-spacing: .5px;
}
.sync-input:focus { outline: none; border-color: rgba(79, 214, 165, .5); }
.sync-input::placeholder { color: var(--faint); }
.sync-warn { color: var(--vivid); font-size: 12.5px; line-height: 1.55; margin-top: 12px; }
.backup-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.backup-note { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-top: 12px; }

@media (max-width: 400px) {
  .view { padding-left: 16px; padding-right: 16px; }
  .topbar { padding-left: 16px; padding-right: 16px; }
  .flow-title { font-size: 24px; }
  .recap-row .rk { width: 88px; }
}
@media (hover: hover) {
  .tabbar button:hover { color: var(--text); }
  .tabbar button.nav-on:hover { color: var(--accent); }
  .brand:hover { opacity: .85; }
  .day-btn:hover { background: var(--surface-2); }
  .seg:hover i { background: rgba(255, 255, 255, .24); }
  .seg.done:hover i, .seg.now:hover i { background: var(--accent); }
  .stars button:hover { transform: scale(1.08); }
  .tag button:hover { color: var(--danger); }
  .suggest button:hover { color: var(--tc, var(--accent)); border-color: var(--tc, var(--accent)); }
  .media-add:hover { color: var(--accent); border-color: rgba(79, 214, 165, .6); }
  .btn-accent:hover { background: #5ee0b0; }
  .btn-ghost:hover { border-color: rgba(255, 255, 255, .24); }
  .btn-danger-ghost:hover { border-color: rgba(255, 90, 95, .5); }
  .jrow:hover { background: rgba(255, 255, 255, .022); box-shadow: 0 0 0 12px rgba(255, 255, 255, .022); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" onclick="go('today')">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="#4fd6a5"/><path d="M12.6 7.2 7.2 12l5.4 4.8V7.2zm5.4 0L12.6 12l5.4 4.8V7.2z" fill="#06251a"/></svg>
      Rewind
    </button>
    <span class="saved-flag" id="saved-flag">Saved</span>
  </header>
  <main class="view" id="view"></main>
</div>
<nav class="tabbar"><div class="tabbar-inner">
  <button class="tab" id="tab-today" onclick="go('today')"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4.2L19 9.2a2.97 2.97 0 1 0-4.2-4.2L4 15.8z"/><path d="M13.4 6.4l4.2 4.2"/></svg>Today</button>
  <button class="tab" id="tab-journal" onclick="go('journal')"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="4" width="17.6" height="16" rx="3.4"/><path d="M7.6 9.2h8.8M7.6 13h8.8M7.6 16.8h5"/></svg>Journal</button>
  <button class="tab" id="tab-stats" onclick="go('stats')"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7.5M12 20V4.6M19 20v-5.6"/></svg>Stats</button>
</div></nav>
<input type="file" id="mediafile" accept="image/*,video/*" multiple style="display:none">

<script>
/* ================= prompts — edit here ================= */
const PROMPTS = {
  rating:   { kind: 'stars', label: 'How was the day?' },
  did:      { kind: 'text',  label: 'What did we do today?',                       ph: 'The day in a nutshell…' },
  places:   { kind: 'tags',  label: 'Did we go anywhere today?',                   ph: 'Type a place, hit Enter' },
  exciting: { kind: 'text',  label: 'What was the most exciting part of your day?', ph: 'The highlight reel moment…' },
  funny:    { kind: 'text',  label: 'One funny thing that happened today',          ph: 'What made you laugh?' },
  saw:      { kind: 'text',  label: 'Did you see anything cool today?',            ph: 'A sunset, a dog, a great fit, anything…' },
  worst:    { kind: 'text',  label: 'What was the worst part of the day?',         ph: 'Get it off your chest…' },
  hard:     { kind: 'text',  label: 'Was there a hard part?',                      ph: 'Something you pushed through…' },
  notes:    { kind: 'text',  label: 'Anything else on your mind?',                 ph: 'Free space — thoughts, wins, gripes…' },
  shows:    { kind: 'tags',  label: 'What TV shows did we watch?',                 ph: 'Type a show, hit Enter' },
  food:     { kind: 'tags',  label: 'Did we eat anything good?',                   ph: 'Type a dish, hit Enter' },
  drinks:   { kind: 'tags',  label: 'What did we drink, if anything?',             ph: 'Type a drink, hit Enter' },
  people:   { kind: 'tags',  label: 'Did we hang out with anybody?',               ph: 'Type a name, hit Enter' },
};
/* pages of the flow — a few prompts per page, then the last page = photos + recap */
const PAGES = [
  { title: 'The day',        sub: 'Start with the shape of it.',              fields: ['rating', 'did', 'places'] },
  { title: 'The good stuff', sub: 'The parts worth keeping.',                 fields: ['exciting', 'funny', 'saw'] },
  { title: 'The real stuff', sub: 'No one reads this but you.',               fields: ['worst', 'hard', 'notes'] },
  { title: 'The extras',     sub: 'What was on, on the table, and around.',   fields: ['shows', 'food', 'drinks', 'people'] },
  { title: 'Photos & videos', sub: 'Anything from today worth keeping.',      fields: [], media: true, recap: true },
];
const TEXT_FIELDS = Object.keys(PROMPTS).filter(f => PROMPTS[f].kind === 'text');
const TAG_FIELDS  = Object.keys(PROMPTS).filter(f => PROMPTS[f].kind === 'tags');
const STAR_HINTS = ['', 'Rough one', 'Meh', 'Fine', 'Good day', 'Great day'];

/* ================= icons ================= */
const ICON = {
  star:   '<svg class="ic-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.9l2.86 5.79 6.39.93-4.62 4.5 1.09 6.36L12 17.48l-5.72 3 1.09-6.36-4.62-4.5 6.39-.93z"/></svg>',
  chevL:  '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
  chevR:  '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>',
  cal:    '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="5" width="17.2" height="15.6" rx="3.4"/><path d="M3.4 9.9h17.2M8 2.9v3.8M16 2.9v3.8"/></svg>',
  search: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6L20.2 20.2"/></svg>',
};
/* One colour per tag type, drawn from Aftershow's category set so the two apps agree.
   Shows reuse Aftershow's TV Show cyan on purpose. */
const TAG_COLORS = {
  places: '#5aa7ff',
  shows:  '#21c8d0',
  food:   '#ff7a45',
  drinks: '#ff5a9e',
  people: '#a78bfa',
};
function tcVar(field) { return TAG_COLORS[field] ? ` style="--tc:${TAG_COLORS[field]}"` : ''; }
function cdot(field) { return TAG_COLORS[field] ? `<i class="cdot"${tcVar(field)}></i>` : ''; }
function starsRow(n) { return n ? '<span class="jrow-stars">' + ICON.star.repeat(n) + '</span>' : ''; }

/* ================= data ================= */
/* ---- Sync is built but deliberately OFF for the 1.0 App Store release. ----
   Rewind ships local-only: no account, no server, nothing uploaded — which is what
   privacy.html promises. VaultSync (vault-sync.js) is finished and works; it is simply
   not wired in. To turn it back on, all three of these have to happen together:
     1. SYNC_ENABLED = true, below
     2. re-add the vault-sync.js script tag above the main script
     3. re-add  vault-sync.js  to the cp list in package.json and to ASSETS in sw.js
   And rewrite privacy.html first — shipping sync makes its current wording untrue. */
const SYNC_ENABLED = false;

const KEY = 'rewind.entries.v1';
let entries = {};
try { entries = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { entries = {}; }

function save() {
  // Every edit path funnels through here, so this is the one place a day can be
  // timestamped without missing a case.
  if (entries[currentKey]) entries[currentKey].updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(entries));
  if (global_syncReady) VaultSync.schedule();
  const f = document.getElementById('saved-flag');
  if (f) { f.classList.add('on'); clearTimeout(save._t); save._t = setTimeout(() => f.classList.remove('on'), 1200); }
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function todayKey() { return dateKey(new Date()); }
function blank(k) {
  const e = { date: k, rating: 0, media: [] };
  for (const f of TEXT_FIELDS) e[f] = '';
  for (const f of TAG_FIELDS) e[f] = [];
  return e;
}
function getEntry(k) {
  if (!entries[k]) entries[k] = blank(k);
  const e = entries[k];
  for (const f of TEXT_FIELDS) if (typeof e[f] !== 'string') e[f] = '';
  for (const f of TAG_FIELDS) if (!Array.isArray(e[f])) e[f] = [];
  if (!Array.isArray(e.media)) e.media = [];
  if (typeof e.rating !== 'number') e.rating = 0;
  return e;
}
function isEmptyEntry(e) {
  return !e.rating && !e.media.length && TEXT_FIELDS.every(f => !e[f].trim()) && TAG_FIELDS.every(f => !e[f].length);
}
function filledKeys() { return Object.keys(entries).filter(k => !isEmptyEntry(getEntry(k))).sort().reverse(); }

/* ================= media store (IndexedDB) ================= */
const MDB = { name: 'rewind-media', store: 'media', db: null };
function mdb() {
  if (MDB.db) return Promise.resolve(MDB.db);
  return new Promise((res, rej) => {
    const rq = indexedDB.open(MDB.name, 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore(MDB.store, { keyPath: 'id' }); };
    rq.onsuccess = () => { MDB.db = rq.result; res(MDB.db); };
    rq.onerror = () => rej(rq.error);
  });
}
function mput(rec) { return mdb().then(db => new Promise((res, rej) => { const t = db.transaction(MDB.store, 'readwrite'); t.objectStore(MDB.store).put(rec); t.oncomplete = res; t.onerror = () => rej(t.error); })); }
function mget(id)  { return mdb().then(db => new Promise((res, rej) => { const rq = db.transaction(MDB.store).objectStore(MDB.store).get(id); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); })); }
function mdel(id)  { return mdb().then(db => new Promise((res, rej) => { const t = db.transaction(MDB.store, 'readwrite'); t.objectStore(MDB.store).delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); })); }
const urlCache = new Map();
async function mediaURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const rec = await mget(id);
  if (!rec) return null;
  const u = URL.createObjectURL(rec.blob);
  urlCache.set(id, u);
  return u;
}
function shrinkImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const MAX = 1600;
      let { width: w, height: h } = img;
      if (w <= MAX && h <= MAX && file.size < 900000) return resolve(file);
      const s = Math.min(1, MAX / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); resolve(file); }; // HEIC etc — keep original
    img.src = u;
  });
}
async function addMediaFiles(files) {
  const e = getEntry(currentKey);
  for (const file of files) {
    const isVideo = file.type.startsWith('video/');
    const blob = isVideo ? file : await shrinkImage(file);
    const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 7);
    await mput({ id, date: currentKey, type: isVideo ? 'video' : 'image', mime: blob.type || file.type, blob, created: Date.now() });
    e.media.push(id);
  }
  save();
  renderMediaGrid();
}
async function removeMedia(id) {
  const e = getEntry(currentKey);
  e.media = e.media.filter(x => x !== id);
  await mdel(id);
  if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
  save();
  renderMediaGrid();
}
document.getElementById('mediafile').onchange = ev => { if (ev.target.files.length) addMediaFiles([...ev.target.files]); ev.target.value = ''; };

/* ================= state + routing ================= */
let route = 'today';
let currentKey = todayKey();
let pageIdx = 0;
let searchQ = '';

function go(r) { route = r; if (r === 'today' && currentKey !== todayKey() && !isEmptyEntry(getEntry(currentKey))) {} render(); }
function openDay(k) { currentKey = k; pageIdx = 0; route = 'today'; render(); }
function fmtLong(k) { return parseKey(k).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtShort(k) { return parseKey(k).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function render() {
  ['today', 'journal', 'stats'].forEach(t => document.getElementById('tab-' + t).classList.toggle('nav-on', route === t));
  const v = document.getElementById('view');
  if (route === 'today') { v.innerHTML = renderFlow(); wireFlow(); }
  else if (route === 'journal') { v.innerHTML = renderJournal(); wireJournal(); }
  else v.innerHTML = renderStats();
  window.scrollTo(0, 0);
}

/* ================= the flow ================= */
function renderFlow() {
  const e = getEntry(currentKey);
  const isToday = currentKey === todayKey();
  const pg = PAGES[pageIdx];
  let h = `
    <div class="flow-head">
      <div class="flow-kicker">${dayKicker(currentKey)}</div>
      <div class="day-nav">
        <button class="day-btn" onclick="shiftDay(-1)" aria-label="Previous day">${ICON.chevL}</button>
        <label class="day-btn" aria-label="Pick a date">${ICON.cal}<input type="date" id="daypick" value="${currentKey}" max="${todayKey()}"></label>
        <button class="day-btn" onclick="shiftDay(1)" ${isToday ? 'disabled' : ''} aria-label="Next day">${ICON.chevR}</button>
      </div>
    </div>
    <h1 class="flow-title">${fmtLong(currentKey).replace(/, \d{4}$/, '')}</h1>
    <div class="progress">
      <div class="segs">${PAGES.map((p, i) => `<button class="seg ${i < pageIdx ? 'done' : ''} ${i === pageIdx ? 'now' : ''}" onclick="gotoPage(${i})" title="${esc(p.title)}"><i></i></button>`).join('')}</div>
      <div class="step-lbl">${pageIdx + 1} / ${PAGES.length}</div>
    </div>
    <div class="page" id="page">
      <h2 class="page-title">${esc(pg.title)}</h2>
      <p class="page-sub">${esc(pg.sub)}</p>`;
  for (const f of pg.fields) h += promptHTML(f, e);
  if (pg.media) {
    h += `
      <div class="q">
        <div class="q-body">
          <div class="media-grid" id="media-grid"></div>
          <div class="media-note">Stored on this device only — they're never uploaded anywhere.</div>
        </div>
      </div>`;
  }
  if (pg.recap) h += `<h2 class="page-title" style="margin-top:30px">Your rewind</h2>${recapHTML(e)}`;
  h += `</div>
    <div class="flow-foot">
      <button class="btn-ghost" onclick="gotoPage(${pageIdx - 1})" ${pageIdx === 0 ? 'disabled' : ''}>Back</button>
      ${pageIdx < PAGES.length - 1
        ? `<button class="btn-accent" onclick="gotoPage(${pageIdx + 1})">Next</button>`
        : `<button class="btn-accent" onclick="finishDay()">Done</button>`}
    </div>`;
  return h;
}
function promptHTML(f, e) {
  const p = PROMPTS[f];
  let body = '';
  if (p.kind === 'stars') {
    body = `<div class="stars" id="stars">${[1,2,3,4,5].map(n => `<button data-n="${n}" class="${e.rating >= n ? 'lit' : ''}" aria-label="${n} star${n > 1 ? 's' : ''}">${ICON.star}</button>`).join('')}</div>
            <div class="stars-hint" id="stars-hint">${STAR_HINTS[e.rating] || ''}</div>`;
  } else if (p.kind === 'text') {
    body = `<textarea id="txt-${f}" rows="1" placeholder="${esc(p.ph)}">${esc(e[f])}</textarea>`;
  } else {
    body = `<div class="tag-row" id="tags-${f}"></div><div class="suggest" id="sug-${f}"></div>`;
  }
  return `<div class="q"${tcVar(f)}><div class="q-label">${esc(p.label)}</div><div class="q-body">${body}</div></div>`;
}
function recapHTML(e) {
  const rows = [];
  if (e.rating) rows.push(['Day rating', '', `<span class="recap-stars">${ICON.star.repeat(e.rating)}</span><span class="recap-hint">${esc(STAR_HINTS[e.rating] || '')}</span>`]);
  for (const f of Object.keys(PROMPTS)) {
    const p = PROMPTS[f];
    if (p.kind === 'text' && e[f].trim()) rows.push([p.label.replace(/\?$/, ''), e[f]]);
    if (p.kind === 'tags' && e[f].length) rows.push([p.label.replace(/\?$/, ''), e[f].join(', ')]);
  }
  if (!rows.length) return `<div class="recap-empty">Nothing written yet — go back and fill in a few.</div>`;
  return `<div class="recap">${rows.map(([k, v, html]) =>
    `<div class="recap-row"><span class="rk">${esc(shortLabel(k))}</span><span class="rv">${html || esc(v)}</span></div>`).join('')}</div>`;
}
function shortLabel(label) {
  return ({
    'What did we do today': 'Did', 'Did we go anywhere today': 'Went', 'What was the most exciting part of your day': 'Exciting',
    'One funny thing that happened today': 'Funny', 'Did you see anything cool today': 'Saw', 'What was the worst part of the day': 'Worst',
    'Was there a hard part': 'Hard part', 'Anything else on your mind': 'Notes', 'What TV shows did we watch': 'Watched',
    'Did we eat anything good': 'Ate', 'What did we drink, if anything': 'Drank', 'Did we hang out with anybody': 'With',
  })[label] || label;
}

function wireFlow() {
  const e = getEntry(currentKey);
  const pg = PAGES[pageIdx];
  document.getElementById('daypick').onchange = ev => { if (ev.target.value) { currentKey = ev.target.value; pageIdx = 0; render(); } };
  document.querySelectorAll('#stars button').forEach(b => {
    b.onclick = () => {
      const n = Number(b.dataset.n);
      e.rating = (e.rating === n) ? 0 : n;
      document.querySelectorAll('#stars button').forEach(x => x.classList.toggle('lit', e.rating >= Number(x.dataset.n)));
      document.getElementById('stars-hint').textContent = STAR_HINTS[e.rating] || '';
      save();
    };
  });
  for (const f of pg.fields) {
    const p = PROMPTS[f];
    if (p.kind === 'text') {
      const t = document.getElementById('txt-' + f);
      t.oninput = () => { e[f] = t.value; autoGrow(t); save(); };
    } else if (p.kind === 'tags') renderTags(f);
  }
  requestAnimationFrame(() => { for (const f of pg.fields) if (PROMPTS[f].kind === 'text') autoGrow(document.getElementById('txt-' + f)); });
  if (pg.media) renderMediaGrid();
}
function autoGrow(t) { if (!t) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function gotoPage(i) { if (i < 0 || i >= PAGES.length) return; pageIdx = i; render(); }
function shiftDay(dir) {
  const d = parseKey(currentKey); d.setDate(d.getDate() + dir);
  if (dateKey(d) > todayKey()) return;
  currentKey = dateKey(d); pageIdx = 0; render();
}
function finishDay() { pageIdx = 0; go('journal'); }
function dayKicker(k) {
  const t = todayKey();
  if (k === t) return 'Today';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (k === dateKey(y)) return 'Yesterday';
  return parseKey(k).getFullYear();
}

/* ---- tags ---- */
function renderTags(field) {
  const e = getEntry(currentKey);
  const wrap = document.getElementById('tags-' + field);
  if (!wrap) return;
  const p = PROMPTS[field];
  wrap.innerHTML = e[field].map((t, i) =>
    `<span class="tag">${cdot(field)}${esc(t)}<button onclick="delTag('${field}',${i})" title="Remove">✕</button></span>`
  ).join('') + `<input id="in-${field}" placeholder="${e[field].length ? 'Add another…' : esc(p.ph)}" autocapitalize="words">`;
  const inp = document.getElementById('in-' + field);
  inp.onkeydown = ev => {
    if (ev.key === 'Enter' && inp.value.trim()) { ev.preventDefault(); addTag(field, inp.value.trim()); }
    else if (ev.key === 'Backspace' && !inp.value && e[field].length) { delTag(field, e[field].length - 1); }
  };
  inp.onblur = () => { if (inp.value.trim()) addTag(field, inp.value.trim()); };
  const counts = {};
  for (const k of Object.keys(entries)) for (const t of (entries[k][field] || [])) counts[t] = (counts[t] || 0) + 1;
  const sugs = Object.keys(counts)
    .filter(t => !e[field].some(x => x.toLowerCase() === t.toLowerCase()))
    .sort((a, b) => counts[b] - counts[a]).slice(0, 6);
  document.getElementById('sug-' + field).innerHTML =
    sugs.map(t => `<button onclick="addTag('${field}', ${JSON.stringify(esc(t)).replace(/"/g, '&quot;')})">+ ${esc(t)}</button>`).join('');
}
function addTag(field, val) {
  const e = getEntry(currentKey);
  if (!e[field].some(x => x.toLowerCase() === val.toLowerCase())) e[field].push(val);
  save(); renderTags(field);
  const inp = document.getElementById('in-' + field);
  if (inp) inp.focus();
}
function delTag(field, i) { const e = getEntry(currentKey); e[field].splice(i, 1); save(); renderTags(field); }

/* ---- media grid ---- */
async function renderMediaGrid() {
  const grid = document.getElementById('media-grid');
  if (!grid) return;
  const e = getEntry(currentKey);
  let h = `<button class="media-add" onclick="document.getElementById('mediafile').click()"><span class="plus">+</span>Add</button>`;
  for (const id of e.media) {
    const rec = await mget(id);
    if (!rec) continue;
    const u = await mediaURL(id);
    h += `<div class="media-tile" onclick="openLightbox('${id}')">
      ${rec.type === 'video' ? `<video src="${u}" muted playsinline preload="metadata"></video><span class="vid-badge">Video</span>` : `<img src="${u}" alt="">`}
      <button class="del" onclick="event.stopPropagation(); removeMedia('${id}')" title="Remove">✕</button>
    </div>`;
  }
  grid.innerHTML = h;
}
async function openLightbox(id) {
  const rec = await mget(id); if (!rec) return;
  const u = await mediaURL(id);
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = (rec.type === 'video' ? `<video src="${u}" controls autoplay playsinline></video>` : `<img src="${u}" alt="">`) + `<button class="close">✕</button>`;
  lb.onclick = ev => { if (ev.target === lb || ev.target.classList.contains('close')) lb.remove(); };
  document.body.appendChild(lb);
}

/* ================= journal ================= */
function renderJournal() {
  return `<div class="search-wrap">${ICON.search}<input id="jsearch" placeholder="Search your journal" autocapitalize="none" autocorrect="off"></div>
          <div class="jlist" id="jlist">${journalListHTML()}</div>`;
}
function wireJournal() {
  const s = document.getElementById('jsearch');
  s.value = searchQ; s.oninput = () => { searchQ = s.value; refreshJournalList(); };
  fillThumbs();
}
function refreshJournalList() { document.getElementById('jlist').innerHTML = journalListHTML(); fillThumbs(); }
async function fillThumbs() {
  for (const img of document.querySelectorAll('img[data-mid]')) {
    const u = await mediaURL(img.dataset.mid);
    if (u) img.src = u; else img.remove();
  }
}
function journalListHTML() {
  let keys = filledKeys();
  const q = searchQ.trim().toLowerCase();
  if (q) keys = keys.filter(k => { const e = getEntry(k); return [...TEXT_FIELDS.map(f => e[f]), ...TAG_FIELDS.flatMap(f => e[f]), fmtLong(k)].join(' ').toLowerCase().includes(q); });
  if (!keys.length) return `<div class="empty">${q ? 'No entries match that search.' : 'No entries yet.<br>Head to <b>Today</b> and rewind your first day.'}</div>`;
  let out = '', lastMonth = '';
  for (const k of keys) {
    const e = getEntry(k), d = parseKey(k);
    const month = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    if (month !== lastMonth) { out += `<div class="month-h">${month}</div>`; lastMonth = month; }
    const snippet = e.did || e.exciting || e.funny || TEXT_FIELDS.map(f => e[f]).find(v => v.trim()) || '';
    const chips = TAG_FIELDS.flatMap(f => e[f].map(v => [f, v]));
    if (e.media.length) chips.push(['media', e.media.length + (e.media.length === 1 ? ' photo' : ' photos')]);
    const shown = chips.slice(0, 5), extra = chips.length - shown.length;
    const firstImg = e.media[0];
    out += `<div class="jrow" onclick="openDay('${k}')">
      <div class="jrow-cal">
        <div class="d">${d.getDate()}</div>
        <div class="w">${d.toLocaleDateString('en-US', { weekday: 'short' })}</div>
      </div>
      <div class="jrow-main">
        <div class="jrow-top"><div class="jrow-body">${snippet ? esc(snippet) : '<span style="color:var(--muted)">No notes</span>'}</div>${starsRow(e.rating)}</div>
        ${shown.length ? `<div class="jrow-chips">${shown.map(([f, c]) => `<span class="mini-chip">${cdot(f)}${esc(c)}</span>`).join('')}${extra > 0 ? `<span class="mini-chip more">+${extra}</span>` : ''}</div>` : ''}
      </div>
      ${firstImg ? `<img class="jrow-thumb" data-mid="${firstImg}" alt="">` : ''}
    </div>`;
  }
  return out;
}

/* ================= stats ================= */
function computeStreak() {
  const set = new Set(filledKeys()); let streak = 0; const d = new Date();
  if (!set.has(dateKey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dateKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function topCounts(field, limit) {
  const counts = {};
  for (const k of filledKeys()) for (const t of getEntry(k)[field]) counts[t] = (counts[t] || 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, limit);
}
function rankSection(title, field, rows) {
  if (!rows.length) return '';
  const max = rows[0][1];
  const bars = max > 1;
  return `<div class="stat-section"${tcVar(field)}><div class="stat-h">${cdot(field)}${title}</div>
    ${rows.map(([name, n], i) => `<div class="rank-row"><span class="rank-n">${i + 1}</span><span class="rank-name">${esc(name)}</span>${bars ? `<span class="rank-bar"><i style="width:${Math.max(10, Math.round(n / max * 100))}%"></i></span>` : ''}<span class="rank-count">${n}×</span></div>`).join('')}</div>`;
}
function renderStats() {
  // Backup (and Sync, when enabled) must render even with no entries: importing a backup
  // and linking a new device are exactly what you do when this device is empty.
  const keys = filledKeys();
  if (!keys.length) {
    return `<div class="empty">No entries yet — Stats fill in once you've written a few.</div>` + statsTailHTML();
  }
  const rated = keys.map(k => getEntry(k).rating).filter(r => r > 0);
  const avg = rated.length ? (rated.reduce((a, b) => a + b, 0) / rated.length).toFixed(1) : '—';
  const best = keys.filter(k => getEntry(k).rating === 5).length;
  const photos = keys.reduce((n, k) => n + getEntry(k).media.length, 0);
  const streak = computeStreak();
  const set = new Set(keys), strip = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); strip.push(set.has(dateKey(d))); }
  return `
    <div class="hero">
      <div class="hero-top"><span class="hero-num">${streak}</span><span class="hero-lbl">day${streak === 1 ? '' : 's'} in a row</span></div>
      <div class="strip">${strip.map(on => `<i class="${on ? 'on' : ''}"></i>`).join('')}</div>
      <div class="strip-lbl">Last 14 days</div>
    </div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="stat-num">${keys.length}</div><div class="stat-lbl">Days rewound</div></div>
      <div class="stat-tile"><div class="stat-num">${avg}</div><div class="stat-lbl">Avg day rating</div></div>
      <div class="stat-tile"><div class="stat-num">${best}</div><div class="stat-lbl">5-star days</div></div>
      <div class="stat-tile"><div class="stat-num">${photos}</div><div class="stat-lbl">Photos &amp; videos</div></div>
    </div>
    ${rankSection('Most-watched shows', 'shows', topCounts('shows', 8))}
    ${rankSection('Best bites — most-logged food', 'food', topCounts('food', 8))}
    ${rankSection('Most-poured drinks', 'drinks', topCounts('drinks', 8))}
    ${rankSection('Most-seen people', 'people', topCounts('people', 8))}
    ${rankSection('Places we kept going', 'places', topCounts('places', 8))}`;
}

function statsTailHTML() {
  return `
    ${SYNC_ENABLED ? `<div class="stat-section"><div class="stat-h">Sync</div>
      <div id="syncbox">${syncBoxHTML()}</div>
    </div>` : ''}
    <div class="stat-section"><div class="stat-h">Backup</div>
      <div class="backup-row">
        <button class="btn-ghost" onclick="exportJSON()">Export JSON</button>
        <button class="btn-ghost" onclick="document.getElementById('importfile').click()">Import JSON</button>
        <input type="file" id="importfile" accept=".json" style="display:none" onchange="importJSON(this)">
        <button class="btn-ghost btn-danger-ghost" onclick="eraseAll()">Delete all data</button>
      </div>
      <div class="backup-note">Backups include everything you wrote. Photos and videos stay on this device.</div>
    </div>`;
}

/* ================= sync UI ================= */
let syncPanel = null;   // null | 'new' | 'enter' | 'code'

function fmtAgo(ts) {
  if (!ts) return 'not yet';
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  return Math.floor(hrs / 24) + ' days ago';
}

function syncBoxHTML() {
  if (!window.VaultSync || !VaultSync.supported()) {
    return `<div class="sync-line">Sync needs a secure connection, which this browser isn't giving the page. Export JSON still works.</div>`;
  }
  const st = VaultSync.getStatus();

  if (syncPanel === 'new') {
    const code = syncPendingCode;
    return `<div class="sync-line">This is your sync code. It is the <b>only</b> key to your journal — write it down somewhere safe before you continue.</div>
      <div class="sync-code" id="newcode">${esc(code)}</div>
      <div class="backup-row">
        <button class="btn-ghost" onclick="copyCode()">Copy code</button>
        <button class="btn-ghost" onclick="confirmNewCode()">I've saved it — turn on sync</button>
        <button class="btn-ghost" onclick="syncPanel=null; refreshSyncBox()">Cancel</button>
      </div>
      <div class="sync-warn">Nobody can recover this for you. Not me, not the server — it only ever stores encrypted text it can't read. Lose the code and the synced copy is gone for good.</div>`;
  }

  if (syncPanel === 'enter') {
    return `<div class="sync-line">Enter the sync code from your other device.</div>
      <input class="sync-input" id="codein" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <div class="backup-row">
        <button class="btn-ghost" onclick="submitCode()">Link this device</button>
        <button class="btn-ghost" onclick="syncPanel=null; refreshSyncBox()">Cancel</button>
      </div>
      <div class="sync-warn" id="codeerr"></div>`;
  }

  if (syncPanel === 'code') {
    return `<div class="sync-line">Your sync code — enter this on another device to join it to this journal.</div>
      <div class="sync-code" id="newcode">${esc(VaultSync.getCode() || '')}</div>
      <div class="backup-row">
        <button class="btn-ghost" onclick="copyCode()">Copy code</button>
        <button class="btn-ghost" onclick="syncPanel=null; refreshSyncBox()">Hide</button>
      </div>`;
  }

  if (!st.linked) {
    return `<div class="sync-line">Your journal lives only on this device. Turn on sync to keep them on your phone and your Mac at once — encrypted, so the server only ever holds text it can't read.</div>
      <div class="backup-row">
        <button class="btn-ghost" onclick="startNewCode()">Turn on sync</button>
        <button class="btn-ghost" onclick="syncPanel='enter'; refreshSyncBox()">I have a code</button>
      </div>`;
  }

  const dot = st.status === 'syncing' ? 'busy' : (st.status === 'error' ? 'err' : (st.status === 'offline' ? '' : 'ok'));
  const label = st.status === 'syncing' ? 'Syncing…'
    : st.status === 'offline' ? 'Offline — will sync when you\'re back'
    : st.status === 'error' ? (st.error || 'Something went wrong')
    : 'Synced ' + fmtAgo(st.lastSync);
  return `<div class="sync-line"><span class="sync-dot ${dot}"></span>${esc(label)}</div>
    <div class="backup-row">
      <button class="btn-ghost" onclick="VaultSync.syncNow()">Sync now</button>
      <button class="btn-ghost" onclick="syncPanel='code'; refreshSyncBox()">Show my code</button>
      <button class="btn-ghost btn-danger-ghost" onclick="stopSync()">Turn off sync</button>
    </div>`;
}

let syncPendingCode = '';
function refreshSyncBox() { const b = document.getElementById('syncbox'); if (b) b.innerHTML = syncBoxHTML(); }
function startNewCode() { syncPendingCode = VaultSync.generateCode(); syncPanel = 'new'; refreshSyncBox(); }
function copyCode() {
  const el = document.getElementById('newcode');
  if (!el) return;
  const text = el.textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('Code copied.'), () => prompt('Copy your code:', text));
  else prompt('Copy your code:', text);
}
async function confirmNewCode() {
  try { await VaultSync.link(syncPendingCode); syncPendingCode = ''; syncPanel = null; refreshSyncBox(); }
  catch (e) { alert(e.message || 'Could not turn on sync.'); }
}
async function submitCode() {
  const inp = document.getElementById('codein');
  const err = document.getElementById('codeerr');
  if (!inp) return;
  if (!VaultSync.isValidCode(inp.value)) { err.textContent = 'That code is not the right shape — it should be 24 letters and numbers.'; return; }
  err.textContent = 'Linking…';
  try { await VaultSync.link(inp.value); syncPanel = null; refreshSyncBox(); }
  catch (e) { err.textContent = e.message || 'Could not link with that code.'; }
}
function stopSync() {
  if (!confirm('Turn off sync on this device?\n\nYour entries stay here, and the synced copy stays on the server so your other devices keep working.')) return;
  VaultSync.unlink();
  syncPanel = null;
  refreshSyncBox();
}

/* ================= backup ================= */
function exportJSON() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'rewind-backup-' + todayKey() + '.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result); let added = 0;
      for (const k of Object.keys(data)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
        if (!entries[k] || isEmptyEntry(getEntry(k))) { entries[k] = data[k]; getEntry(k); added++; }
      }
      save(); render(); alert('Imported ' + added + ' entries (existing entries were kept).');
    } catch (e) { alert('Could not read that file — is it a Rewind backup?'); }
  };
  reader.readAsText(file); input.value = '';
}

async function eraseAll() {
  if (!confirm('Delete ALL Rewind data on this device? Every entry, photo, and video. This can\'t be undone.')) return;
  if (!confirm('Last check — really delete everything?')) return;
  for (const k of Object.keys(entries)) { for (const id of getEntry(k).media) { try { await mdel(id); } catch (e) {} } }
  for (const u of urlCache.values()) URL.revokeObjectURL(u);
  urlCache.clear();
  entries = {};
  localStorage.removeItem(KEY);
  // Unlink rather than push the wipe: erasing this device shouldn't silently empty
  // your other devices, and it leaves the synced copy recoverable with your code.
  const wasLinked = window.VaultSync && VaultSync.isLinked();
  if (wasLinked) VaultSync.unlink();
  route = 'today'; currentKey = todayKey(); pageIdx = 0; searchQ = '';
  render();
  alert('Everything on this device has been deleted.' + (wasLinked
    ? '\n\nSync was turned off here. Your synced copy is untouched — enter your code again to pull it back.'
    : ''));
}

/* ================= sync ================= */
let global_syncReady = false;

/* Days written before sync existed get their timestamp from the day itself rather than
   from "now", so two devices holding the same old entry agree. */
(() => {
  let stamped = false;
  for (const k of Object.keys(entries)) {
    if (entries[k] && !entries[k].updatedAt) { entries[k].updatedAt = parseKey(k).getTime(); stamped = true; }
  }
  // Persist immediately so the stored copy matches memory; otherwise anything reading
  // localStorage directly sees un-stamped entries.
  if (stamped) localStorage.setItem(KEY, JSON.stringify(entries));
})();

const syncAdapter = {
  exportItems() {
    const items = {};
    for (const k of Object.keys(entries)) {
      const e = entries[k];
      if (!e) continue;
      // Untouched blank days are created just by visiting a date — don't sync those.
      if (!e.updatedAt && isEmptyEntry(getEntry(k))) continue;
      items[k] = { u: e.updatedAt || 0, d: 0, x: e };
    }
    return items;
  },
  importItems(items) {
    const live = entries[currentKey];
    const next = {};
    for (const k of Object.keys(items)) {
      const it = items[k];
      if (it.d && it.d >= (it.u || 0)) continue;
      if (it.x) next[k] = it.x;
    }
    // The editor holds a direct reference to today's object; swapping it out mid-edit
    // would drop whatever is being typed.
    if (live && route === 'today') next[currentKey] = live;
    entries = next;
    localStorage.setItem(KEY, JSON.stringify(entries));
    // Re-rendering the flow would blow away focus and the caret, so only refresh the
    // read-only views.
    if (route !== 'today') render();
  },
};

if (SYNC_ENABLED && window.VaultSync && VaultSync.supported()) {
  VaultSync.init({ appId: 'rewind', adapter: syncAdapter });
  VaultSync.onStatus(() => { const b = document.getElementById('syncbox'); if (b) b.innerHTML = syncBoxHTML(); });
  global_syncReady = true;
}

/* ================= boot ================= */
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
